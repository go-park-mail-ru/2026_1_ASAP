services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: ${BACKEND_HOST:-0.0.0.0}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}   # дефолтная база 0, если не указана

      # Postgres / Database
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"

      # MinIO / S3-compatible storage
      S3_HOST: ${S3_HOST:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-localhost}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-8080}

    depends_on:
      - redis
      - db
      - migrate
      - minio
    restart: always

  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: always

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        RETRIES=10
        until migrate -path=/migrations -database="postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable" up || [ $$RETRIES -eq 0 ]; do
          echo "Migration failed, retrying in 3s..."
          RETRIES=$$((RETRIES-1))
          sleep 3
        done
    depends_on:
      - db
    restart: "no"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  minio_data: