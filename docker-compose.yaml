services:
  backend:
    build: .
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      # Backend
      PORT: ${BACKEND_PORT}
      HOST: ${BACKEND_HOST}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}   # дефолтная база 0, если не указана

      # Postgres / Database
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"

    depends_on:
      - redis
      - db
      - migrate
    restart: always

  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: always

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        RETRIES=10
        until migrate -path=/migrations -database="postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable" up || [ $RETRIES -eq 0 ]; do
          echo "Migration failed, retrying in 3s..."
          RETRIES=$((RETRIES-1))
          sleep 3
        done
    depends_on:
      - db
    restart: "no"