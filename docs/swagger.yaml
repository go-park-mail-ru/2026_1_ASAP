host: pulseapp.space:8080
info:
  contact: {}
  description: API веб-приложения Pulse
  title: API Pulse App
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация юзера с логином и паролем
      parameters:
      - description: Запрос на логин
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_auth.RequestLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseLoginSuccessForSwagger'
        "400":
          description: Неправильный запрос или ошибка формата полей
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Некорректные данные логины
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Логин пользователя
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Завершение сессии пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseLogoutSuccessForSwagger'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Ошибка выхода
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Выход пользователя
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя с email и login
      parameters:
      - description: Запрос на регистрацию
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_auth.RequestRegistrate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseRegisterSuccessForSwagger'
        "400":
          description: Неправильный запрос или ошибка формата полей
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "409":
          description: пользователь уже существует
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/v1/chats:
    get:
      consumes:
      - application/json
      description: Возвращает все чаты пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseGetChatsSuccessForSwagger'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Невозможно получить чаты
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Получить список чатов
      tags:
      - chats
    post:
      consumes:
      - application/json
      description: Создаёт новый чат
      parameters:
      - description: Запрос на создание чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_chat.ChatCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseCreateChatSuccessForSwagger'
        "400":
          description: Некорретный запрос или ошибка формата полей
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Пользователь неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Ошибка создания чата
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Создать чат
      tags:
      - chats
  /api/v1/chats/{chat_id}:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о чате
      parameters:
      - description: ID чата
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseGetChatByIDSuccessForSwagger'
        "400":
          description: Некорректный ID чата
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Пользователь неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "404":
          description: Чат не найден
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Внутреняя ошибка
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Получить чат по ID
      tags:
      - chats
  /api/v1/profile/{id}:
    get:
      consumes:
      - application/json
      description: Получение собственного профиля пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseGetProfileSuccessForSwagger'
        "400":
          description: Невалидный формат json
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Внутреняя ошибка
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Получение собственного профиля пользователя
      tags:
      - profile
  /api/v1/profile/me:
    get:
      consumes:
      - application/json
      description: Получение собственного профиля пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseGetProfileSuccessForSwagger'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Внутреняя ошибка
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Получение профиля пользователя
      tags:
      - profile
  /api/v1/profiles/me/avatar:
    patch:
      consumes:
      - multipart/form-data
      description: Загружает новый аватар текущего пользователя
      parameters:
      - description: Файл аватара (image/jpeg|image/jpg|image/png|image/webp|image/gif),
          до 5MB
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseUpdateProfileForSwagger'
        "400":
          description: Некорректный файл аватара
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "500":
          description: Внутреняя ошибка
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Обновление аватара пользователя
      tags:
      - profile
  /api/v1/profiles/me/bio:
    patch:
      consumes:
      - application/json
      description: Обновляет bio текущего авторизованного пользователя
      parameters:
      - description: Запрос на обновление био (поле bio)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_profile.RequestUpdateBio'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ResponseUpdateProfileForSwagger'
        "400":
          description: Невалидный json или bio не может быть пустым
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_ASAP_internal_dto_api.ApiErrorResponse'
      summary: Обновление bio пользователя
      tags:
      - profile
swagger: "2.0"
