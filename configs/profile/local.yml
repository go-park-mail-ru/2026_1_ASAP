# Profile gRPC (когда вынесете в cmd/profile). Секреты: POSTGRES_PASSWORD, S3_* — через .env.
server:
  host: 0.0.0.0
  port: "8002"

postgres:
  host: db
  port: "5432"
  user: postgres
  db: asap

s3:
  host: minio
  port: "9000"
  bucket: media
  use_ssl: false
  public_use_ssl: false
  public_host: localhost
  public_port: "9000"

media:
  grpc_addr: "media:8003"

app:
  shutdown_seconds: 10
  log_level: info
