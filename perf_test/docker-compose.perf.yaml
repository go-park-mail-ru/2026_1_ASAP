services:
  gateway:
    build:
      context: ..
      dockerfile: ./docker/gateway.Dockerfile
    env_file:
      - ../.env
    environment:
      APPLICATION_CONFIG: local
    ports:
      - "8089:8088"
    depends_on:
      - auth
      - profile
      - chat
      - subscription
    restart: unless-stopped

  chat:
    build:
      context: ..
      dockerfile: ./docker/chat.Dockerfile
    env_file:
      - ../.env
    environment:
      APPLICATION_CONFIG: local
    depends_on:
      - db
      - migrate
      - profile
      - subscription
      - redis
    restart: unless-stopped

  profile:
    build:
      context: ..
      dockerfile: ./docker/profile.Dockerfile
    env_file:
      - ../.env
    environment:
      APPLICATION_CONFIG: local
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - db
      - migrate
      - minio
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: ./docker/auth.Dockerfile
      args:
        SERVICE_NAME: auth
    env_file:
      - ../.env
    environment:
      APPLICATION_CONFIG: local
    depends_on:
      - redis
      - db
      - migrate
      - minio
    restart: unless-stopped

  subscription:
    build:
      context: ..
      dockerfile: ./docker/subscription.Dockerfile
    env_file:
      - ../.env
    environment:
      APPLICATION_CONFIG: local
    depends_on:
      - db
      - migrate
    restart: unless-stopped

  redis:
    image: redis:latest
    env_file:
      - ../.env
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: asap
    volumes:
      - perf_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: asap
    volumes:
      - ../db/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        RETRIES=10
        until migrate -path=/migrations -database="postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB?sslmode=disable" up || [ $$RETRIES -eq 0 ]; do
          echo "Migration failed, retrying in 3s..."
          RETRIES=$$((RETRIES-1))
          sleep 3
        done
    depends_on:
      - db
    restart: "no"

  minio:
    image: minio/minio:latest
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - perf_minio_data:/data
    restart: unless-stopped

volumes:
  perf_pg_data:
  perf_minio_data:
