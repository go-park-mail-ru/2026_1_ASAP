syntax = "proto3";

package chat.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_ASAP/gen/go/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service Chat {
  rpc GetChats(RequestGetUserChats) returns (ResponseGetUserChats);
  rpc Create(RequestChatCreate) returns (ChatInformation);
  rpc GetChatByID(RequestGetChatByID) returns(ChatInformation);
  rpc DeleteChat(RequestDeleteChat) returns (google.protobuf.Empty);

  rpc UpdateChatAvatar(RequestUpdateAvatar) returns (ChatInformation);
  rpc UpdateChatTitle(RequestUpdateTitle) returns (ChatInformation);
  rpc AddMembersToChat(RequestAddMembersToChat) returns (google.protobuf.Empty);
  rpc DeleteMemberFromChat(RequestDeleteMemberFromChat) returns (google.protobuf.Empty);
  rpc GetChatMembers(RequestChatMembers) returns (ResponseGetChatMembers);
  rpc QuitChat(RequestQuitChat) returns (google.protobuf.Empty);
  rpc JoinChannel(RequestJoinChannel) returns (google.protobuf.Empty);
  rpc UpdateChatDescription(RequestUpdateDescription) returns (ChatInformation);
  rpc UploadMessageAttachment(RequestUploadMessageAttachment) returns (ResponseUploadMessageAttachment);
  rpc AuthorizeMessageAttachment(RequestAuthorizeMessageAttachment) returns (ResponseAuthorizeMessageAttachment);
  rpc GetStickerPacks(google.protobuf.Empty) returns (ResponseGetStickerPacks);
}

enum ChatErrorCode {
  CHAT_ERROR_UNSPECIFIED = 0;

  CHAT_ERROR_INVALID_INPUT = 1;
  CHAT_ERROR_NOT_FOUND = 2;
  CHAT_ERROR_INTERNAL = 3;

  CHAT_ERROR_DIALOG_EXISTS = 4;
  CHAT_ERROR_CHAT_ALREADY_EXISTS = 5;
  CHAT_ERROR_CHAT_NOT_FOUND = 6;

  CHAT_ERROR_USER_NOT_FOUND = 7;
  CHAT_ERROR_USER_NOT_MEMBER = 8;

  CHAT_ERROR_ONLY_OWNER_CAN_DELETE_CHAT = 9;
  CHAT_ERROR_ONLY_OWNER_CAN_ADD_PEOPLE = 10;
  CHAT_ERROR_ONLY_OWNER_CAN_DELETE_PEOPLE = 11;

  CHAT_ERROR_DIALOG_CANT_HAVE_CUSTOM_TITLE = 12;
  CHAT_ERROR_DIALOG_CANT_HAVE_CUSTOM_AVATAR = 13;
  CHAT_ERROR_CANT_CREATE_DIALOG_WITH_YOURSELF = 14;
  CHAT_ERROR_DIALOG_MUST_HAVE_2_USERS = 15;

  CHAT_ERROR_NO_MESSAGE = 16;
  CHAT_ERROR_MESSAGE_EMPTY = 17;
  CHAT_ERROR_MESSAGE_TOO_LONG = 18;
  CHAT_ERROR_MESSAGE_NOT_MEMBER = 19;

  CHAT_ERROR_MEMBER_ALREADY_IN_CHAT = 20;
  CHAT_ERROR_MEMBER_NOT_FOUND = 21;
  CHAT_ERROR_NOT_MEMBER = 22;

  CHAT_ERROR_CANT_ADD_MEMBER_TO_DIALOG = 23;
  CHAT_ERROR_CANT_DELETE_MEMBER_FROM_DIALOG = 24;
  CHAT_ERROR_CANT_DELETE_OWNER_OF_CHAT = 25;
  CHAT_ERROR_CANT_QUIT_DIALOG = 26;
  CHAT_ERROR_OWNER_CANT_QUIT_GROUP = 27;
  CHAT_ERROR_ONLY_CHANNEL_CAN_BE_JOINED = 28;
  CHAT_ERROR_DIALOG_CANT_HAVE_CUSTOM_DESCRIPTION = 29;
  CHAT_ERROR_ONLY_OWNER_CAN_CHANGE_DESCRIPTION = 30;

  CHAT_ERROR_INVALID_ATTACHMENT = 31;
  CHAT_ERROR_ATTACHMENT_NOT_OWNED = 32;
  CHAT_ERROR_CONTACT_NOT_FOUND = 33;
  CHAT_ERROR_TOO_MANY_ATTACHMENTS = 34;
  CHAT_ERROR_INVALID_STICKER = 35;
  CHAT_ERROR_STICKER_NOT_FOUND = 36;
}

message RequestQuitChat {
  int64 user_id = 1;
  int64 chat_id = 2;
}

message RequestChatMembers {
  int64 user_id = 1;
  int64 chat_id = 2;
}

message ResponseGetChatMembers {
  repeated int64 members_id = 1;
}

message RequestDeleteMemberFromChat {
  int64 user_id = 1;
  int64 chat_id = 2;
  int64 member_id = 3;
}

message RequestAddMembersToChat {
  int64 user_id = 1;
  int64 chat_id = 2;
  repeated int64 members_id = 3;
}

message RequestJoinChannel {
  int64 user_id = 1;
  int64 chat_id = 2;
}

message RequestUpdateTitle {
  int64 user_id = 1;
  int64 chat_id = 2;
  string title = 3;
}

message RequestUpdateDescription {
  int64 user_id = 1;
  int64 chat_id = 2;
  string description = 3;
}

message RequestUpdateAvatar {
  int64 user_id = 1;
  bytes content = 2;
  string type = 3;
  int64 chat_id = 4;
}

message RequestDeleteChat {
  int64 user_id = 1;
  int64 chat_id = 2;
}

message RequestGetChatByID {
  int64 user_id = 1;
  int64 chat_id = 2;
}

message RequestChatCreate {
  int64 user_id = 1;
  ChatType type = 2;
  string title = 3;
  repeated int64 members_id = 4;
}

message RequestGetUserChats {
  int64 user_id = 1;
}

message ResponseGetUserChats {
  repeated ChatInformation chats = 1;
}

message MessageInformation {
  int64 sender_id = 1;
  string text = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ChatInformation {
  int64 id = 1;
  ChatType type = 2;
  string title = 3;
  MessageInformation last_message = 4;
  optional string avatar = 5;
  int64 owner_id = 6;
  optional string description = 7;
}

enum ChatType {
  DIALOG = 0;
  GROUP = 1;
  CHANNEL = 2;
}

enum MessageAttachmentKind {
  MESSAGE_ATTACHMENT_KIND_UNSPECIFIED = 0;
  MESSAGE_ATTACHMENT_KIND_PHOTO = 1;
  MESSAGE_ATTACHMENT_KIND_VIDEO = 2;
  MESSAGE_ATTACHMENT_KIND_FILE = 3;
  MESSAGE_ATTACHMENT_KIND_VOICE = 4;
}

message RequestUploadMessageAttachment {
  int64 user_id = 1;
  MessageAttachmentKind kind = 2;
  bytes content = 3;
  string type = 4;
  optional string file_name = 5;
}

message ResponseUploadMessageAttachment {
  string attachment_url = 1;
  string mime_type = 2;
  int64 file_size = 3;
  optional string file_name = 4;
  string object_key = 5;
  int32 duration_ms = 6;
  repeated uint32 waveform = 7;
}

message RequestAuthorizeMessageAttachment {
  int64 user_id = 1;
  string object_key = 2;
}

message ResponseAuthorizeMessageAttachment {
  string content_type = 1;
  int64 size = 2;
  optional string file_name = 3;
}

message Sticker {
  int64 id = 1;
  int64 pack_id = 2;
  string file_url = 3;
  optional string slug = 4;
  optional string emoji = 5;
  optional int32 width = 6;
  optional int32 height = 7;
}

message StickerPack {
  int64 id = 1;
  string name = 2;
  string title = 3;
  optional string slug = 4;
  optional string thumbnail_url = 5;
  repeated Sticker stickers = 6;
}

message ResponseGetStickerPacks {
  repeated StickerPack packs = 1;
}
